<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIGA | Gestão de Distribuição de Água</title>
<style>
:root{--navy:#102f46;--blue:#087fc1;--cyan:#20b7d5;--bg:#f2f6fa;--line:#dfe8ef;--muted:#718292;--green:#16865c;--red:#c94b4b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:#193246}button,input,select,textarea{font:inherit}button{cursor:pointer}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(140deg,#0e3048,#087fc1)}
.loginbox{background:#fff;padding:30px;border-radius:17px;width:min(410px,100%);box-shadow:0 15px 50px #001c3344}.loginbox h1{margin:0 0 8px}.logo{font-size:24px;font-weight:800;color:var(--navy)}.logo small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:5px}
.layout{display:none;min-height:100vh}.sidebar{width:235px;background:var(--navy);color:white;padding:20px 13px;flex-shrink:0}.sidebar .logo{color:white;padding:5px 10px 25px}.sidebar .logo small{color:#a8c4d6}.nav button{width:100%;border:0;background:none;color:#d4e2ec;text-align:left;padding:12px 13px;border-radius:8px;margin:2px 0}.nav button.active,.nav button:hover{background:#205371;color:#fff}
main{flex:1;min-width:0}.topbar{height:65px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 25px}.content{padding:25px;max-width:1450px;margin:auto}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.heading h1{font-size:24px;margin:0 0 5px}.muted{color:var(--muted);font-size:13px}.btn{border:0;border-radius:8px;padding:10px 14px;background:var(--blue);color:white;font-weight:700}.btn.light{background:#e7f3fa;color:#126a9e}.btn.dark{background:var(--navy)}.btn.danger{background:#fff0f0;color:var(--red)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:17px}.card .k{font-size:13px;color:var(--muted)}.card .v{font-size:25px;font-weight:800;margin-top:8px;overflow-wrap:anywhere}.panel h3{margin:0 0 15px;font-size:16px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.toolbar input{max-width:320px}.field label{display:block;font-size:12px;color:#566d7e;margin:0 0 6px}.field input,.field select,.field textarea,.toolbar input{width:100%;padding:10px;border:1px solid #d5e0e8;border-radius:8px;background:#fff;color:#193246}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.full{grid-column:1/-1}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);white-space:nowrap}th{background:#f8fafc;color:#607586}.badge{font-size:11px;padding:4px 8px;border-radius:20px;background:#edf2f6}.badge.green{background:#e5f6ee;color:#14734c}.badge.orange{background:#fff2dc;color:#94600b}.empty{text-align:center;padding:25px;color:var(--muted)}.modal{display:none;position:fixed;inset:0;background:#061d2e99;z-index:5;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.dialog{background:#fff;width:min(680px,100%);max-height:92vh;overflow:auto;border-radius:14px;padding:21px}.dialoghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.dialoghead h2{font-size:19px;margin:0}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast{display:none;position:fixed;bottom:20px;right:20px;background:#143c55;color:#fff;padding:13px 17px;border-radius:9px;z-index:9;max-width:90%}.notice{padding:12px;background:#fff8e8;border:1px solid #f3dfb0;border-radius:9px;color:#77591c;font-size:13px;margin-bottom:16px}.login .notice{margin-top:15px}.hidden{display:none!important}
@media(max-width:850px){.sidebar{width:190px}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.layout{display:block}.sidebar{width:100%;padding:10px}.sidebar .logo{padding:5px 8px 10px}.nav{display:flex;overflow-x:auto;gap:3px}.nav button{white-space:nowrap;width:auto;padding:9px}.topbar{height:55px;padding:0 13px}.content{padding:14px}.cards{gap:8px}.card{padding:12px}.card .v{font-size:20px}.heading{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<section id="login" class="login"><div class="loginbox">
<div class="logo">SIGA<small>Sistema Integrado de Gestão de Água</small></div>
<h1>Iniciar sessão</h1><p class="muted">Gestão de distribuição de água por contadores.</p>
<form id="loginForm"><div class="field"><label>Utilizador</label><input name="user" value="admin" required></div><div class="field" style="margin-top:12px"><label>Senha</label><input name="pass" type="password" value="1234" required></div><button class="btn" style="width:100%;margin-top:17px">Entrar</button></form>
<div class="notice">Demonstração: utilizador <b>admin</b>, senha <b>1234</b>. Altere as credenciais no código antes de disponibilizar o site publicamente.</div>
</div></section>
<div id="app" class="layout">
<aside class="sidebar"><div class="logo">SIGA<small>Gestão de distribuição de água</small></div><nav class="nav" id="nav">
<button class="active" data-page="dashboard">▦ Dashboard</button><button data-page="clientes">♙ Clientes</button><button data-page="contratos">▤ Contratos e ligações</button><button data-page="contadores">◉ Contadores</button><button data-page="leituras">▥ Leituras</button><button data-page="faturas">▧ Faturação</button><button data-page="pagamentos">＄ Pagamentos</button><button data-page="despesas">↘ Despesas</button><button data-page="config">⚙ Configurações</button>
</nav></aside>
<main><header class="topbar"><b id="pageTitle">Dashboard</b><div><span class="muted">Administrador</span> <button class="btn light" id="logout">Sair</button></div></header><section class="content" id="view"></section></main>
</div>
<div class="modal" id="modal"><div class="dialog"><div class="dialoghead"><h2 id="modalTitle"></h2><button class="btn light" onclick="closeModal()">Fechar</button></div><div id="modalBody"></div></div></div><div id="toast" class="toast"></div>
<script>
const KEY='siga_maputo_v1';
const $=s=>document.querySelector(s);
const today=()=>new Date().toISOString().slice(0,10);
const month=()=>today().slice(0,7);
const money=n=>new Intl.NumberFormat('pt-MZ',{style:'currency',currency:'MZN',maximumFractionDigits:2}).format(Number(n||0));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db=load(),page='dashboard';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||fresh()}catch{return fresh()}}
function fresh(){return {clientes:[],contratos:[],contadores:[],leituras:[],faturas:[],pagamentos:[],despesas:[],tarifa:50,empresa:'Distribuidora de Água',counter:1}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function id(prefix){return prefix+'-'+String(db.counter++).padStart(5,'0')}
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',3200)}
function modal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modal').classList.add('show')}
function closeModal(){$('#modal').classList.remove('show')}
function field(label,name,type='text',required=true,value='',extra=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" ${required?'required':''} value="${esc(value)}" ${extra}></div>`}
function sel(label,name,opts,required=true){return `<div class="field"><label>${label}</label><select name="${name}" ${required?'required':''}>${opts.map(o=>`<option value="${esc(o.value)}">${esc(o.label)}</option>`).join('')}</select></div>`}
function formData(form){return Object.fromEntries(new FormData(form))}
function showApp(){ $('#login').classList.add('hidden');$('#app').style.display='flex';render('dashboard')}
$('#loginForm').onsubmit=e=>{e.preventDefault();let d=formData(e.target);if(d.user==='admin'&&d.pass==='1234')showApp();else toast('Credenciais inválidas.')};
$('#logout').onclick=()=>location.reload();
$('#nav').onclick=e=>{let b=e.target.closest('[data-page]');if(!b)return;document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));render(b.dataset.page)};
function heading(title,sub,btn=''){return `<div class="heading"><div><h1>${title}</h1><div class="muted">${sub}</div></div>${btn}</div>`}
function table(headers,rows,empty='Sem registos.'){return `<div class="panel tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||''}</tbody></table>${rows?'':`<div class="empty">${empty}</div>`}</div>`}
function render(p){page=p;$('#pageTitle').textContent=({dashboard:'Dashboard',clientes:'Clientes',contratos:'Contratos e ligações',contadores:'Contadores',leituras:'Leituras mensais',faturas:'Faturação',pagamentos:'Pagamentos',despesas:'Despesas',config:'Configurações'})[p];({dashboard,clientes,contratos,contadores,leituras,faturas,pagamentos,despesas,config}[p])()}
function dashboard(){let paid=db.pagamentos.reduce((s,x)=>s+x.valor,0),billed=db.faturas.reduce((s,x)=>s+x.total,0),debt=db.faturas.reduce((s,x)=>s+Math.max(0,x.total-paidFor(x.id)),0);
$('#view').innerHTML=heading('Visão geral','Resumo operacional da rede de distribuição')+`<div class="cards">${[['Clientes',db.clientes.length],['Ligações ativas',db.contratos.filter(x=>x.estado==='Ativo').length],['Total faturado',money(billed)],['Pagamentos registados',money(paid)],['Saldo em dívida',money(debt)],['Contadores instalados',db.contadores.length],['Leituras registadas',db.leituras.length],['Tarifa atual',money(db.tarifa)+' / m³']].map(x=>`<div class="card"><div class="k">${x[0]}</div><div class="v">${x[1]}</div></div>`).join('')}</div><div class="panel"><h3>Fluxo de trabalho</h3><p class="muted">1. Cadastre o cliente e a ligação. 2. Instale o contador. 3. Registe a leitura mensal. 4. Gere a fatura. 5. Registe o pagamento.</p><div class="toolbar"><button class="btn" onclick="render('clientes')">Novo cliente</button><button class="btn light" onclick="render('leituras')">Registar leitura</button><button class="btn light" onclick="render('faturas')">Gerar faturas</button></div></div>`}
function clientes(){let rows=db.clientes.map(c=>`<tr><td>${c.codigo}</td><td>${esc(c.nome)}</td><td>${esc(c.telefone)}</td><td>${esc(c.bairro)}</td><td>${esc(c.tipo)}</td><td><span class="badge green">${c.estado}</span></td></tr>`).join('');
$('#view').innerHTML=heading('Clientes','Cadastro de consumidores residenciais',`<button class="btn" onclick="novoCliente()">+ Novo cliente</button>`)+`<div class="toolbar"><input id="q" placeholder="Pesquisar nome, código ou telefone" oninput="searchClients()"></div><div id="clientTable">${table(['Código','Nome','Telefone','Bairro','Tipo','Estado'],rows)}</div>`}
function searchClients(){let q=$('#q').value.toLowerCase();let rows=db.clientes.filter(c=>(c.nome+c.codigo+c.telefone+c.bairro).toLowerCase().includes(q)).map(c=>`<tr><td>${c.codigo}</td><td>${esc(c.nome)}</td><td>${esc(c.telefone)}</td><td>${esc(c.bairro)}</td><td>${c.tipo}</td><td>${c.estado}</td></tr>`).join('');$('#clientTable').innerHTML=table(['Código','Nome','Telefone','Bairro','Tipo','Estado'],rows)}
function novoCliente(){modal('Registar cliente',`<form id="f"><div class="grid">${field('Nome completo','nome')}${field('Telefone','telefone','tel')}${field('Telefone alternativo','alternativo','tel',false)}${field('Documento de identificação','documento','text',false)}${sel('Tipo de cliente','tipo',[{value:'Residencial',label:'Residencial'},{value:'Comercial',label:'Comercial'}])}${field('Bairro','bairro')}${field('Quarteirão','quarteirao','text',false)}${field('Número da casa','casa','text',false)}<div class="field full"><label>Referência / observações</label><textarea name="referencia"></textarea></div></div><div class="actions"><button class="btn">Guardar cliente</button></div></form>`);$('#f').onsubmit=e=>{e.preventDefault();let d=formData(e.target);db.clientes.push({...d,codigo:id('CLI'),estado:'Ativo'});save();closeModal();toast('Cliente registado.');clientes()}}
function contratos(){let rows=db.contratos.map(c=>{let cl=db.clientes.find(x=>x.codigo===c.cliente);return `<tr><td>${c.codigo}</td><td>${esc(cl?.nome||'—')}</td><td>${esc(c.bairro)}</td><td>${c.data}</td><td>${money(db.tarifa)}/m³</td><td><span class="badge ${c.estado==='Ativo'?'green':'orange'}">${c.estado}</span></td></tr>`}).join('');
$('#view').innerHTML=heading('Contratos e ligações','Contratos de fornecimento na rede única',`<button class="btn" onclick="novoContrato()">+ Novo contrato</button>`)+table(['Contrato','Cliente','Bairro','Início','Tarifa','Estado'],rows)}
function novoContrato(){if(!db.clientes.length){toast('Registe primeiro um cliente.');return}modal('Criar contrato e ligação',`<form id="f"><div class="grid">${sel('Cliente','cliente',db.clientes.map(c=>({value:c.codigo,label:c.nome+' — '+c.telefone})))}${field('Data de início','data','date',true,today())}${field('Bairro da ligação','bairro')}${field('Dia de vencimento','vencimento','number',true,'15','min="1" max="28"')}${field('Número da casa','casa','text',false)}<div class="field full"><label>Observações</label><textarea name="obs"></textarea></div></div><div class="actions"><button class="btn">Criar contrato</button></div></form>`);$('#f').onsubmit=e=>{e.preventDefault();let d=formData(e.target);db.contratos.push({...d,codigo:id('CTR'),estado:'Ativo',ligacao:id('LIG')});save();closeModal();toast('Contrato criado.');contratos()}}
function contadores(){let rows=db.contadores.map(c=>`<tr><td>${esc(c.serie)}</td><td>${esc(db.clientes.find(x=>x.codigo===c.cliente)?.nome||'—')}</td><td>${esc(c.ligacao)}</td><td>${c.instalacao}</td><td>${Number(c.inicial).toFixed(3)}</td></tr>`).join('');
$('#view').innerHTML=heading('Contadores','Registo e instalação de contadores',`<button class="btn" onclick="novoContador()">+ Instalar contador</button>`)+table(['Nº de série','Cliente','Ligação','Instalação','Leitura inicial'],rows)}
function novoContador(){let available=db.contratos.filter(c=>!db.contadores.some(m=>m.contrato===c.codigo)&&c.estado==='Ativo');if(!available.length){toast('Não há contratos ativos sem contador.');return}modal('Instalar contador',`<form id="f"><div class="grid">${sel('Contrato / ligação','contrato',available.map(c=>({value:c.codigo,label:c.codigo+' — '+(db.clientes.find(x=>x.codigo===c.cliente)?.nome||'Cliente')})))}${field('Número de série','serie')}${field('Marca / modelo','marca','text',false)}${field('Data de instalação','instalacao','date',true,today())}${field('Leitura inicial (m³)','inicial','number',true,'0','min="0" step=".001"')}</div><div class="actions"><button class="btn">Guardar contador</button></div></form>`);$('#f').onsubmit=e=>{e.preventDefault();let d=formData(e.target),ct=db.contratos.find(x=>x.codigo===d.contrato);db.contadores.push({...d,cliente:ct.cliente,ligacao:ct.ligacao});save();closeModal();toast('Contador instalado.');contadores()}}
function leituras(){let rows=db.leituras.slice().reverse().map(l=>{let m=db.contadores.find(x=>x.codigo===l.contador);return `<tr><td>${l.mes}</td><td>${esc(db.clientes.find(x=>x.codigo===m?.cliente)?.nome||'—')}</td><td>${esc(m?.serie||'—')}</td><td>${Number(l.valor).toFixed(3)} m³</td><td>${l.tipo}</td></tr>`}).join('');
$('#view').innerHTML=heading('Leituras mensais','Registo manual da leitura dos contadores',`<button class="btn" onclick="novaLeitura()">+ Registar leitura</button>`)+table(['Mês','Cliente','Contador','Leitura','Tipo'],rows)}
function novaLeitura(){if(!db.contadores.length){toast('Instale primeiro um contador.');return}modal('Registar leitura',`<form id="f"><div class="grid">${sel('Contador','contador',db.contadores.map(c=>({value:c.codigo,label:c.serie+' — '+(db.clientes.find(x=>x.codigo===c.cliente)?.nome||'Cliente')})))}${field('Mês de referência','mes','month',true,month())}${field('Leitura atual (m³)','valor','number',true,'','min="0" step=".001"')}${sel('Tipo de leitura','tipo',[{value:'Real',label:'Real'},{value:'Estimada',label:'Estimada'}])}</div><div class="actions"><button class="btn">Guardar leitura</button></div></form>`);$('#f').onsubmit=e=>{e.preventDefault();let d=formData(e.target),prev=db.leituras.filter(x=>x.contador===d.contador&&x.mes<d.mes).sort((a,b)=>b.mes.localeCompare(a.mes))[0],meter=db.contadores.find(x=>x.codigo===d.contador),min=prev?Number(prev.valor):Number(meter.inicial);if(Number(d.valor)<min){toast('A leitura não pode ser inferior à leitura anterior ('+min+').');return}if(db.leituras.some(x=>x.contador===d.contador&&x.mes===d.mes)){toast('Já existe leitura para este contador e mês.');return}db.leituras.push({...d,codigo:id('LEI'),valor:Number(d.valor)});save();closeModal();toast('Leitura registada.');leituras()}}
function paidFor(fid){return db.pagamentos.filter(p=>p.fatura===fid).reduce((s,p)=>s+p.valor,0)}
function faturas(){let rows=db.faturas.slice().reverse().map(f=>{let cl=db.clientes.find(x=>x.codigo===f.cliente),paid=paidFor(f.codigo),bal=Math.max(0,f.total-paid);return `<tr><td>${f.codigo}</td><td>${esc(cl?.nome||'—')}</td><td>${f.mes}</td><td>${f.consumo.toFixed(3)}</td><td>${money(f.total)}</td><td>${money(paid)}</td><td>${money(bal)}</td><td><span class="badge ${bal===0?'green':'orange'}">${bal===0?'Paga':paid?'Parcial':'Pendente'}</span></td></tr>`}).join('');
$('#view').innerHTML=heading('Faturação','Geração de faturas mensais pelo consumo',`<button class="btn" onclick="gerarFaturas()">Gerar faturas</button>`)+table(['Fatura','Cliente','Mês','Consumo m³','Total','Pago','Saldo','Estado'],rows)}
function gerarFaturas(){modal('Gerar faturação',`<form id="f"><div class="field"><label>Mês de referência</label><input name="mes" type="month" value="${month()}" required></div><p class="muted">Serão faturados contratos ativos com leitura registada no mês escolhido. O consumo é leitura atual menos leitura anterior.</p><div class="actions"><button class="btn">Gerar faturas</button></div></form>`);$('#f').onsubmit=e=>{e.preventDefault();let m=formData(e.target).mes,created=0;db.contadores.forEach(meter=>{let ct=db.contratos.find(x=>x.codigo===meter.contrato),read=db.leituras.find(x=>x.contador===meter.codigo&&x.mes===m);if(!ct||ct.estado!=='Ativo'||!read||db.faturas.some(f=>f.contrato===ct.codigo&&f.mes===m))return;let prev=db.leituras.filter(x=>x.contador===meter.codigo&&x.mes<m).sort((a,b)=>b.mes.localeCompare(a.mes))[0],old=prev?Number(prev.valor):Number(meter.inicial),cons=Number(read.valor)-old;if(cons<0)return;let total=cons*Number(db.tarifa);db.faturas.push({codigo:id('FAT'),contrato:ct.codigo,cliente:ct.cliente,mes:m,consumo:cons,anterior:old,atual:Number(read.valor),preco:Number(db.tarifa),total:Number(total.toFixed(2)),vencimento:ct.vencimento});created++});save();closeModal();toast(created+' fatura(s) gerada(s).');faturas()}}
function pagamentos(){let open=db.faturas.filter(f=>f.total-paidFor(f.codigo)>0),rows=db.pagamentos.slice().reverse().map(p=>`<tr><td>${p.codigo}</td><td>${esc(db.clientes.find(c=>c.codigo===p.cliente)?.nome||'—')}</td><td>${money(p.valor)}</td><td>${p.metodo}</td><td>${p.data}</td></tr>`).join('');
$('#view').innerHTML=heading('Pagamentos','Registo de recebimentos',`<button class="btn" onclick="novoPagamento()">+ Registar pagamento</button>`)+`<div class="panel"><h3>Faturas em aberto</h3>${table(['Fatura','Cliente','Total','Pago','Saldo'],open.map(f=>`<tr><td>${f.codigo}</td><td>${esc(db.clientes.find(c=>c.codigo===f.cliente)?.nome||'—')}</td><td>${money(f.total)}</td><td>${money(paidFor(f.codigo))}</td><td>${money(f.total-paidFor(f.codigo))}</td></tr>`).join(''))}</div><br><h3>Histórico de pagamentos</h3>${table(['Recibo','Cliente','Valor','Método','Data'],rows)}`}
function novoPagamento(){if(!db.faturas.some(f=>f.total-paidFor(f.codigo)>0)){toast('Não existem faturas em aberto.');return}modal('Registar pagamento',`<form id="f"><div class="grid">${sel('Fatura','fatura',db.faturas.filter(f=>f.total-paidFor(f.codigo)>0).map(f=>({value:f.codigo,label:f.codigo+' — saldo '+money(f.total-paidFor(f.codigo))})))}${field('Valor recebido (MT)','valor','number',true,'','min=".01" step=".01"')}${sel('Método','metodo',[{value:'Dinheiro',label:'Dinheiro'},{value:'M-Pesa',label:'M-Pesa'},{value:'e-Mola',label:'e-Mola'},{value:'Transferência',label:'Transferência'},{value:'Outro',label:'Outro'}])}${field('Data do pagamento','data','date',true,today())}${field('Referência','referencia','text',false)}</div><div class="actions"><button class="btn">Guardar pagamento</button></div></form>`);$('#f').onsubmit=e=>{e.preventDefault();let d=formData(e.target),inv=db.faturas.find(x=>x.codigo===d.fatura),v=Number(d.valor),bal=inv.total-paidFor(inv.codigo);if(v<=0||v>bal+.001){toast('Valor inválido. Saldo disponível: '+money(bal));return}db.pagamentos.push({...d,codigo:id('REC'),cliente:inv.cliente,valor:v});save();closeModal();toast('Pagamento registado.');pagamentos()}}
function despesas(){let rows=db.despesas.slice().reverse().map(d=>`<tr><td>${d.data}</td><td>${esc(d.descricao)}</td><td>${esc(d.categoria)}</td><td>${money(d.valor)}</td></tr>`).join('');$('#view').innerHTML=heading('Despesas','Controlo dos custos operacionais',`<button class="btn" onclick="novaDespesa()">+ Registar despesa</button>`)+table(['Data','Descrição','Categoria','Valor'],rows)}
function novaDespesa(){modal('Registar despesa',`<form id="f"><div class="grid">${field('Descrição','descricao')}${sel('Categoria','categoria',[{value:'Energia',label:'Energia'},{value:'Combustível',label:'Combustível'},{value:'Manutenção',label:'Manutenção'},{value:'Salários',label:'Salários'},{value:'Material',label:'Material'},{value:'Outros',label:'Outros'}])}${field('Valor (MT)','valor','number',true,'','min=".01" step=".01"')}${field('Data','data','date',true,today())}</div><div class="actions"><button class="btn">Guardar despesa</button></div></form>`);$('#f').onsubmit=e=>{e.preventDefault();let d=formData(e.target);d.valor=Number(d.valor);db.despesas.push(d);save();closeModal();toast('Despesa registada.');despesas()}}
function config(){$('#view').innerHTML=heading('Configurações','Parâmetros básicos do sistema')+`<div class="panel"><form id="f"><div class="grid">${field('Nome da empresa','empresa','text',true,db.empresa)}${field('Preço por m³ (MT)','tarifa','number',true,db.tarifa,'min="0" step=".01"')}</div><div class="actions"><button class="btn">Guardar configurações</button></div></form><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>Dados locais</h3><p class="muted">Os registos ficam guardados neste navegador e neste dispositivo. Exporta regularmente uma cópia de segurança.</p><div class="toolbar"><button class="btn light" onclick="backup()">Exportar cópia JSON</button><label class="btn light" for="restore">Importar cópia JSON</label><input id="restore" type="file" accept=".json,application/json" style="display:none" onchange="restoreBackup(event)"><button class="btn danger" onclick="clearData()">Apagar todos os dados</button></div></div>`;$('#f').onsubmit=e=>{e.preventDefault();let d=formData(e.target);db.empresa=d.empresa;db.tarifa=Number(d.tarifa);save();toast('Configurações guardadas.');config()}}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='siga-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}
function restoreBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.clientes||!x.contratos||!x.faturas)throw Error();db=x;save();toast('Cópia importada.');config()}catch{toast('Ficheiro de cópia inválido.')}};r.readAsText(f)}
function clearData(){if(confirm('Tem certeza que deseja apagar todos os dados guardados neste navegador?')){db=fresh();save();toast('Dados apagados.');render('dashboard')}}
</script></body></html>
